<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quest for Camelot</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div id="stage">

  <!-- TITLE -->
  <div id="screen-title" class="screen">
    <div class="title-plate">Quest for Camelot</div>
    <div class="subtitle">Gather your kin. The Round Table calls.</div>
    <input type="password" id="passphraseInput" class="passphrase-input" placeholder="The Round Table's passphrase" autocomplete="off">
    <div id="passphraseError" class="passphrase-error"></div>
    <button class="btn" id="btnStart">Begin the Quest</button>
  </div>

  <!-- LOGIN -->
  <div id="screen-login" class="screen hidden">
    <div class="title-plate" style="font-size:26px;">Who's Playing?</div>
    <div id="loginNames" class="class-grid login-grid"></div>

    <div id="loginPinPanel" class="hidden">
      <div class="subtitle" id="loginPinPrompt" style="margin-bottom:14px;"></div>
      <input type="tel" inputmode="numeric" maxlength="4" id="pinInput" class="passphrase-input" placeholder="4-digit PIN" autocomplete="off">
      <input type="tel" inputmode="numeric" maxlength="4" id="pinConfirmInput" class="passphrase-input" placeholder="Confirm PIN" autocomplete="off">
      <div class="passphrase-error" id="loginError"></div>
      <button class="btn" id="btnPinSubmit">Enter</button>
      <button class="btn secondary" id="btnLoginBack">Back</button>
    </div>
  </div>

  <!-- CLASS SELECT -->
  <div id="screen-class" class="screen hidden">
    <div class="title-plate" style="font-size:26px;">Choose Your Champion</div>
    <div class="class-grid" id="classGrid"></div>
    <button class="btn secondary" id="btnBack">Back</button>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen hidden" style="padding:0;background:none;">
    <canvas id="canvas" width="1000" height="750"></canvas>
    <div id="hud">
      <div>
        <div id="dungeonLabel">Sherwood Approach</div>
        <div class="bar-wrap"><div class="bar hp" id="hpBar"></div></div>
        <div class="bar-wrap" id="manaWrap"><div class="bar mana" id="manaBar"></div></div>
      </div>
      <div style="text-align:right;">
        <div id="classLabel"></div>
        <div id="gearLabel"><img id="gearIcon" class="hidden" alt=""><span id="gearLabelText">Gear: Iron</span></div>
      </div>
    </div>
    <div id="banner"></div>
    <div id="loot-toast"></div>
    <div id="roster"></div>
    <div id="controls">
      <div class="stick-zone" id="stickZone">
        <div class="stick-base"></div>
        <div class="stick-nub" id="stickNub"></div>
      </div>
      <div class="action-col">
        <button class="abtn special2 hidden" id="btnSpecial2">Special<div class="cd" id="cdSpecial2"></div></button>
        <button class="abtn special1" id="btnSpecial1">Ability<div class="cd" id="cdSpecial1"></div></button>
        <button class="abtn attack" id="btnAttack">Attack</button>
      </div>
    </div>
    <div id="kbHint">Move: WASD / Arrows / gamepad stick &nbsp; Attack: Space / gamepad A &nbsp; Ability: E / gamepad B &nbsp; Special: Q / gamepad X</div>
  </div>

  <!-- END -->
  <div id="screen-end" class="screen hidden">
    <div class="title-plate" id="endTitle">Victory</div>
    <div class="subtitle" id="endSubtitle"></div>
    <button class="btn" id="btnRestart">Return to Camelot</button>
  </div>

</div></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/net.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
